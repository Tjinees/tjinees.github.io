<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dough Calculator — V3</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #2f2f2f;
            --surface: #383838;
            --surface2: #2a2a2a;
            --border: rgba(255,255,255,0.07);
            --border2: rgba(255,255,255,0.13);
            --ink: #ececec;
            --muted: #888;
            --muted2: #aaa;
            --ember: #d4522a;
            --ember-glow: rgba(212,82,42,0.15);
            --cool: #5590c8;
            --tr: 160ms ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding: 44px 20px 80px;
        }
        .container { max-width: 400px; margin: 0 auto; }

        /* HEADER */
        header { margin-bottom: 40px; }
        .brand {
            font-family: 'DM Serif Display', serif;
            font-size: 2.2rem;
            letter-spacing: -0.02em;
            line-height: 1;
            color: var(--ink);
        }
        .brand em { font-style: italic; color: var(--ember); }
        .brand-sub { margin-top: 5px; font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

        /* SECTION */
        .section { margin-bottom: 6px; }

        .section-label {
            font-size: 0.66rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
            padding: 0 2px;
        }

        /* GLASS PANEL */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        /* SEGMENTED CONTROL */
        .seg-control {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 6px;
        }
        .seg-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--muted2);
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background var(--tr), color var(--tr);
            text-align: center;
        }
        .seg-btn.active {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--border2);
        }

        /* ROW */
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }
        .row:last-child { border-bottom: none; }
        .row-label { font-size: 0.81rem; color: var(--ink); }
        .row-sub { font-size: 0.68rem; color: var(--muted); margin-top: 1px; }

        .row input[type="number"] {
            width: 70px;
            padding: 6px 9px;
            font-family: 'DM Mono', monospace;
            font-size: 0.82rem;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 6px;
            color: var(--ink);
            text-align: right;
            transition: border-color var(--tr), box-shadow var(--tr);
            -moz-appearance: textfield;
            outline: none;
        }
        .row input[type="number"]::-webkit-inner-spin-button,
        .row input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
        .row input[type="number"]:focus {
            border-color: var(--ember);
            box-shadow: 0 0 0 3px var(--ember-glow);
        }

        /* PHASE BLOCK */
        .phase-block {
            border-bottom: 1px solid var(--border);
        }
        .phase-block:last-child { border-bottom: none; }

        .phase-name {
            padding: 8px 14px 4px;
            font-size: 0.66rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .phase-pip {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--ember);
            flex-shrink: 0;
        }
        .phase-pip.c2 { background: var(--cool); }
        .phase-pip.c3 { background: #c4941c; }

        .phase-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            padding: 6px 14px 12px;
        }
        .p-cell label {
            display: block;
            font-size: 0.66rem;
            color: var(--muted);
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .p-cell input[type="number"] {
            width: 100%;
            padding: 7px 9px;
            font-family: 'DM Mono', monospace;
            font-size: 0.82rem;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 6px;
            color: var(--ink);
            text-align: right;
            transition: border-color var(--tr), box-shadow var(--tr);
            -moz-appearance: textfield;
            outline: none;
        }
        .p-cell input::-webkit-inner-spin-button,
        .p-cell input::-webkit-outer-spin-button { -webkit-appearance: none; }
        .p-cell input:focus { border-color: var(--ember); box-shadow: 0 0 0 2px var(--ember-glow); }

        /* PIZZA TIME */
        .pizza-time-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .day-strip-row {
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
        }
        .day-strip {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-top: 8px;
        }
        .day-btn {
            padding: 7px 2px;
            border: 1px solid var(--border2);
            border-radius: 6px;
            background: var(--surface2);
            color: var(--muted2);
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            cursor: pointer;
            text-align: center;
            transition: background var(--tr), color var(--tr), border-color var(--tr);
        }
        .day-btn.active {
            background: var(--cool);
            color: var(--ink);
            border-color: var(--cool);
        }
        .time-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
        }
        .time-select {
            padding: 6px 9px;
            font-family: 'DM Mono', monospace;
            font-size: 0.82rem;
            background: var(--surface2);
            border: 1px solid var(--border2);
            border-radius: 6px;
            color: var(--ink);
            outline: none;
            cursor: pointer;
            transition: order-color var(--tr), box-shadow var(--tr);
        }

        .start-banner {
            padding: 11px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .start-banner-label {
            font-size: 0.66rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .start-banner-value {
            font-family: 'DM Serif Display', serif;
            font-size: 1.1rem;
            color: var(--cool);
            text-align: right;
        }
        .start-banner-sub {
            font-family: 'DM Mono', monospace;
            font-size: 0.68rem;
            color: var(--muted);
            text-align: right;
            margin-top: 2px;
        }

        /* RESULTS */
        .results-outer {
            margin-top: 0px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--surface);
        }
        .r-group-label {
            padding: 10px 14px 4px;
            font-size: 0.64rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
        }
        .r-chips {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 6px 14px 12px;
        }
        .r-chip {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 9px 11px;
        }
        .r-chip-label { font-size: 0.66rem; color: var(--muted2); letter-spacing: 0.04em; }
        .r-chip-val {
            font-family: 'DM Serif Display', serif;
            font-size: 1.15rem;
            color: var(--ink);
            letter-spacing: -0.01em;
            margin-top: 2px;
        }
        .r-chip-val .u { font-family: 'DM Mono', monospace; font-size: 0.6rem; color: var(--muted); margin-left: 2px; }
        .r-chip.span2 { grid-column: span 2; }

        .r-divider { height: 1px; background: var(--border); margin: 0 14px; }

        .hidden { display: none; }
    </style>
</head>
<body>
<div class="container">

    <header>
        <div class="brand">Tjin's Pizza<em>.</em></div>
        <div class="brand-sub">Neapolitan Dough Calculator</div>
    </header>

    <!-- Method -->
    <div class="section">
        <div class="section-label">Method</div>
        <div class="seg-control">
            <button class="seg-btn active" id="seg-biga" onclick="setMethod(true)">Biga</button>
            <button class="seg-btn" id="seg-direct" onclick="setMethod(false)">Direct</button>
        </div>
        <input type="checkbox" id="useBiga" checked style="display:none" onchange="updateUI()">
    </div>

    <!-- Dough -->
    <div class="section">
        <div class="section-label">Dough</div>
        <div class="panel">
            <div class="row"><div><div class="row-label">Ball weight</div><div class="row-sub">g each</div></div><input type="number" id="ballWeight" value="270" oninput="calculateDough()"></div>
            <div class="row"><div><div class="row-label">Number of balls</div></div><input type="number" id="ballCount" value="3" oninput="calculateDough()"></div>
            <div class="row"><div><div class="row-label">Hydration</div><div class="row-sub">% of flour</div></div><input type="number" id="hydration" value="65" oninput="calculateDough()"></div>
            <div class="row"><div><div class="row-label">Salt</div><div class="row-sub">% of flour</div></div><input type="number" id="salt" value="3" step="0.1" oninput="calculateDough()"></div>
        </div>
    </div>

    <!-- Biga -->
    <div class="section hidden" id="biga-config">
        <div class="section-label">Biga</div>
        <div class="panel">
            <div class="row"><div><div class="row-label">Biga hydration</div><div class="row-sub">% of biga flour</div></div><input type="number" id="bigaHydration" value="50" oninput="calculateDough()"></div>
        </div>
    </div>

    <!-- Pizza Time -->
    <div class="section">
        <div class="section-label">Pizza Time</div>
        <div class="pizza-time-panel">
            <div class="day-strip-row">
                <div class="row-label">Day</div>
                <div class="day-strip" id="dayStrip"></div>
            </div>
            <div class="time-row">
                <div class="row-label">Time</div>
                <select class="time-select" id="pizzaHour" onchange="calculateDough()"></select>
            </div>
            <div class="start-banner">
                <div>
                    <div class="start-banner-label">Start</div>
                </div>
                <div>
                    <div class="start-banner-value" id="startValue">—</div>
                    <div class="start-banner-sub" id="startSub"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Fermentation -->
    <div class="section">
        <div class="section-label">Fermentation</div>
        <div class="panel">
            <div class="phase-block">
                <div class="phase-name"><span class="phase-pip"></span><span id="label-p1">Phase 1 — Biga</span></div>
                <div class="phase-inputs">
                    <div class="p-cell"><label>Temp °C</label><input type="number" id="temp1" value="21" oninput="calculateDough()"></div>
                    <div class="p-cell"><label>Hours</label><input type="number" id="dur1" value="12" oninput="calculateDough()"></div>
                </div>
            </div>
            <div class="phase-block">
                <div class="phase-name"><span class="phase-pip c2"></span><span id="label-p2">Phase 2 — Fridge</span></div>
                <div class="phase-inputs">
                    <div class="p-cell"><label>Temp °C</label><input type="number" id="temp2" value="4" oninput="calculateDough()"></div>
                    <div class="p-cell"><label>Hours</label><input type="number" id="dur2" value="48" oninput="calculateDough()"></div>
                </div>
            </div>
            <div class="phase-block hidden" id="phase3-section">
                <div class="phase-name"><span class="phase-pip c3"></span>Phase 3 — Final Proof</div>
                <div class="phase-inputs">
                    <div class="p-cell"><label>Temp °C</label><input type="number" id="temp3" value="21" oninput="calculateDough()"></div>
                    <div class="p-cell"><label>Hours</label><input type="number" id="dur3" value="8" oninput="calculateDough()"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Results -->
    <div class="section">
        <div class="section-label">Recipe</div>
        <div class="results-outer" id="results"></div>
    </div>

</div>
<script src="calculator.js"></script>
<script>
const DAYS = ['Mo','Tu','We','Th','Fr','Sa','Su'];

function initDayStrip() {
    const strip = document.getElementById('dayStrip');
    // Default to Saturday (index 5)
    strip.innerHTML = DAYS.map((d, i) => `
        <button class="day-btn${i === 5 ? ' active' : ''}" onclick="selectDay(${i})">${d}</button>
    `).join('');
}

function selectDay(i) {
    document.querySelectorAll('.day-btn').forEach((b, j) => b.classList.toggle('active', j === i));
    calculateDough();
}

function getSelectedDay() {
    const btns = document.querySelectorAll('.day-btn');
    for (let i = 0; i < btns.length; i++) {
        if (btns[i].classList.contains('active')) return i; // 0=Mo … 6=Su
    }
    return 5;
}

function initHourDropdown() {
    const sel = document.getElementById('pizzaHour');
    for (let h = 0; h < 24; h++) {
        const opt = document.createElement('option');
        opt.value = h;
        opt.textContent = String(h).padStart(2,'0') + ':00';
        if (h === 17) opt.selected = true;
        sel.appendChild(opt);
    }
}

// Returns the next Date for the given weekday index (0=Mo…6=Su) at the given hour
function nextOccurrence(dayIndex, hour) {
    const jsDay = (dayIndex + 1) % 7; // Mo=1…Su=0 in JS
    const now = new Date();
    const d = new Date(now);
    d.setHours(hour, 0, 0, 0);
    // Days until target weekday
    let diff = (jsDay - now.getDay() + 7) % 7;
    if (diff === 0 && d <= now) diff = 7; // same day but time has passed → next week
    d.setDate(d.getDate() + diff);
    return d;
}

function calculateStartTime() {
    const useBiga = document.getElementById('useBiga').checked;
    const dayIndex = getSelectedDay();
    const hour = parseInt(document.getElementById('pizzaHour').value);

    const pizzaTime = nextOccurrence(dayIndex, hour);

    const d1 = parseFloat(document.getElementById('dur1').value) || 0;
    const d2 = parseFloat(document.getElementById('dur2').value) || 0;
    const d3 = useBiga ? (parseFloat(document.getElementById('dur3').value) || 0) : 0;
    const totalHours = d1 + d2 + d3;

    const startTime = new Date(pizzaTime.getTime() - totalHours * 60 * 60 * 1000);

    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const startDay = dayNames[startTime.getDay()];
    const startHour = String(startTime.getHours()).padStart(2,'0') + ':00';

    document.getElementById('startValue').textContent = `${startDay} · ${startHour}`;
    document.getElementById('startSub').textContent = `${totalHours}h before pizza time`;
}

function setMethod(bigaOn) {
    document.getElementById('useBiga').checked = bigaOn;
    document.getElementById('seg-biga').classList.toggle('active', bigaOn);
    document.getElementById('seg-direct').classList.toggle('active', !bigaOn);
    updateUI();
}

function updateUI(){
    const biga=document.getElementById('useBiga').checked;
    document.getElementById('biga-config').classList.toggle('hidden',!biga);
    document.getElementById('phase3-section').classList.toggle('hidden',!biga);

    const pip1=document.querySelector('#label-p1').closest('.phase-name').querySelector('.phase-pip');
    const pip2=document.querySelector('#label-p2').closest('.phase-name').querySelector('.phase-pip');

    if(biga){
        document.getElementById('label-p1').textContent='Phase 1 — Biga';
        document.getElementById('label-p2').textContent='Phase 2 — Fridge';
        pip1.className='phase-pip';
        pip2.className='phase-pip c2';
        document.getElementById('temp1').value = 21;
        document.getElementById('temp2').value = 4;
        document.getElementById('dur1').value = 12;
        document.getElementById('dur2').value = 24;
    } else {
        document.getElementById('label-p1').textContent='Phase 1 — Fridge';
        document.getElementById('label-p2').textContent='Phase 2 — Final Proof';
        pip1.className='phase-pip c2';
        pip2.className='phase-pip c3';
        document.getElementById('temp1').value = 4;
        document.getElementById('temp2').value = 21;
        document.getElementById('dur1').value = 24;
        document.getElementById('dur2').value = 8;
    }
    calculateDough();
}

document.addEventListener('DOMContentLoaded', () => {
    initDayStrip();
    initHourDropdown();
    updateUI();
});
</script>
</body>
</html>

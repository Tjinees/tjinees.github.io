<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tjin's Pizza - Dough Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">

    <header>
        <div class="brand">Tjin's Pizza<em>.</em></div>
        <div class="brand-sub">Neapolitan Dough Calculator</div>
    </header>

    <!-- Method -->
    <div class="section">
        <div class="section-label">Method</div>
        <div class="seg-control" role="group" aria-label="Dough method">
            <button type="button" class="seg-btn active" id="seg-direct" aria-pressed="true">Direct</button>
            <button type="button" class="seg-btn" id="seg-biga" aria-pressed="false">Biga</button>
        </div>
    </div>

    <!-- Dough -->
    <div class="section">
        <div class="section-label">Dough</div>
        <div class="panel">
            <div class="row">
                <label class="row-text" for="ballWeight">
                    <span class="row-label">Ball weight</span>
                    <span class="row-sub">g each</span>
                </label>
                <input type="number" id="ballWeight" value="270" min="50" max="2000" step="1" inputmode="numeric">
            </div>
            <div class="row">
                <label class="row-text" for="ballCount">
                    <span class="row-label">Number of balls</span>
                </label>
                <input type="number" id="ballCount" value="3" min="1" max="100" step="1" inputmode="decimal">
            </div>
            <div class="row">
                <label class="row-text" for="hydration">
                    <span class="row-label">Hydration</span>
                    <span class="row-sub">% of flour</span>
                </label>
                <input type="number" id="hydration" value="63" min="40" max="100" step="0.5" inputmode="decimal">
            </div>
            <div class="row">
                <label class="row-text" for="salt">
                    <span class="row-label">Salt</span>
                    <span class="row-sub">% of flour</span>
                </label>
                <input type="number" id="salt" value="3" min="0" max="10" step="0.1" inputmode="decimal">
            </div>
            <div class="row">
                <div class="row-text">
                    <span class="row-label">Yeast type</span>
                    <span class="row-sub">IDY / ADY / Fresh</span>
                </div>
                <div class="seg-control seg-compact" id="yeastTypeControl" role="group" aria-label="Yeast type">
                    <button type="button" class="seg-btn active" data-yeast="idy" aria-pressed="true">IDY</button>
                    <button type="button" class="seg-btn" data-yeast="ady" aria-pressed="false">ADY</button>
                    <button type="button" class="seg-btn" data-yeast="fresh" aria-pressed="false">Fresh</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Biga -->
    <div class="section hidden" id="biga-config">
        <div class="section-label">Biga</div>
        <div class="panel">
            <div class="row">
                <label class="row-text" for="bigaPercent">
                    <span class="row-label">Biga percentage</span>
                    <span class="row-sub">% of total flour</span>
                </label>
                <input type="number" id="bigaPercent" value="80" min="1" max="100" step="1" inputmode="numeric">
            </div>
            <div class="row">
                <label class="row-text" for="bigaHydration">
                    <span class="row-label">Biga hydration</span>
                    <span class="row-sub">% of biga flour</span>
                </label>
                <input type="number" id="bigaHydration" value="50" min="35" max="100" step="1" inputmode="numeric">
            </div>
        </div>
    </div>

    <!-- Fermentation -->
    <div class="section">
        <div class="section-label">Fermentation</div>
        <div class="panel">
            <div class="panel-toggle-row" id="direct-fridge-toggle">
                <div class="seg-control seg-inner" role="group" aria-label="Direct fermentation style">
                    <button type="button" class="seg-btn active" id="seg-rt" aria-pressed="true">Room temp</button>
                    <button type="button" class="seg-btn" id="seg-fridge" aria-pressed="false">+ Fridge</button>
                </div>
            </div>
            <div class="phase-block hidden" id="phase1-section">
                <div class="phase-name"><span class="phase-pip c2" id="pip-p1"></span><span id="label-p1">Phase 1 — Fridge</span></div>
                <div class="phase-inputs">
                    <div class="p-cell"><label for="temp1">Temp °C</label><input type="number" id="temp1" value="4" min="0" max="45" step="0.5" inputmode="decimal"></div>
                    <div class="p-cell"><label for="dur1">Hours</label><input type="number" id="dur1" value="24" min="0" max="168" step="0.5" inputmode="decimal"></div>
                </div>
            </div>
            <div class="phase-block" id="phase2-section">
                <div class="phase-name"><span class="phase-pip c3" id="pip-p2"></span><span id="label-p2">Room Temp</span></div>
                <div class="phase-inputs">
                    <div class="p-cell"><label for="temp2">Temp °C</label><input type="number" id="temp2" value="21" min="0" max="45" step="0.5" inputmode="decimal"></div>
                    <div class="p-cell"><label for="dur2">Hours</label><input type="number" id="dur2" value="24" min="0" max="168" step="0.5" inputmode="decimal"></div>
                </div>
            </div>
            <div class="phase-block hidden" id="phase3-section">
                <div class="phase-name"><span class="phase-pip c3" id="pip-p3"></span>Phase 3 — Final Proof</div>
                <div class="phase-inputs">
                    <div class="p-cell"><label for="temp3">Temp °C</label><input type="number" id="temp3" value="21" min="0" max="45" step="0.5" inputmode="decimal"></div>
                    <div class="p-cell"><label for="dur3">Hours</label><input type="number" id="dur3" value="8" min="0" max="168" step="0.5" inputmode="decimal"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pizza Time -->
    <div class="section">
        <div class="section-label">Pizza Time</div>
        <div class="panel">
            <div class="day-strip-row">
                <div class="row-label">Day</div>
                <div class="day-strip" id="dayStrip" role="group" aria-label="Pizza day"></div>
            </div>
            <div class="row">
                <label class="row-label row-clickable" for="pizzaHour">Time</label>
                <select class="time-select" id="pizzaHour"></select>
            </div>
            <div class="start-banner">
                <div>
                    <div class="start-banner-label">Start</div>
                </div>
                <div>
                    <div class="start-banner-value" id="startValue">—</div>
                    <div class="start-banner-sub" id="startSub"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Results -->
    <div class="section">
        <div class="section-header">
            <div class="section-label">Recipe</div>
            <div class="section-meta" id="recipeSummary"></div>
        </div>
        <div class="panel" id="results" aria-live="polite"></div>
    </div>

</div>
<script src="js/calculator.js"></script>
<script src="js/schedule.js"></script>
<script src="js/app.js"></script>
</body>
</html>
